# CNC Predictive Maintenance System
# Digital Systems Project - Charles Rodway

#   docker-compose up --build
#   Open http://localhost:3000 in Chrome
#   Login: supervisor / admin123  OR  maintenance / maint123

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnc_network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./models:/app/models
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
    networks:
      - cnc_network
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: dashboard
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cnc_network
    restart: unless-stopped

  # lathe containers

  lathe_1:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_lathe
    container_name: lathe_1_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ../bearing_data:/app/bearing_data:ro
      - ./data:/app/data
    environment:
      LATHE_NAME: lathe_1
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.1"
      STREAM_START_PERCENT: "20"
    networks:
      - cnc_network
    restart: unless-stopped

  lathe_2:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_lathe
    container_name: lathe_2_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ../bearing_data:/app/bearing_data:ro
      - ./data:/app/data
    environment:
      LATHE_NAME: lathe_2
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.5"
    networks:
      - cnc_network
    restart: unless-stopped

  lathe_3:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_lathe
    container_name: lathe_3_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ../bearing_data:/app/bearing_data:ro
      - ./data:/app/data
    environment:
      LATHE_NAME: lathe_3
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.5"
    networks:
      - cnc_network
    restart: unless-stopped

networks:
  cnc_network:
    driver: bridge
