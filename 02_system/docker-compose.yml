# CNC Predictive Maintenance System
# Digital Systems Project - Charles Rodway
#
# Services:
#   rabbitmq        - message broker between raspi containers and backend
#   backend         - consumes RabbitMQ messages, holds system state, exposes REST API
#   lathe_1/2/3     - simulate Raspberry Pi edge devices for CNC lathes (bearing monitoring)
#   hydraulic_1/2/3 - simulate Raspberry Pi edge devices for hydraulic units
#
# The dashboard is a standalone HTML file (dashboard.html in project root).
# Open it in Chrome while these containers are running.
# Dashboard connects to the backend API at http://localhost:8000
#
# Usage:
#   docker-compose up --build
#   Then open dashboard.html in Chrome

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnc_network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./models:/app/models
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
    networks:
      - cnc_network
    restart: unless-stopped

  # ── CNC Lathe containers (bearing monitoring) ─────────────────────────────

  lathe_1:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_lathe
    container_name: lathe_1_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ../bearing_data:/app/bearing_data:ro
      - ./data:/app/data
    environment:
      LATHE_NAME: lathe_1
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.1"
      STREAM_START_PERCENT: "20"
    networks:
      - cnc_network
    restart: unless-stopped

  lathe_2:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_lathe
    container_name: lathe_2_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ../bearing_data:/app/bearing_data:ro
      - ./data:/app/data
    environment:
      LATHE_NAME: lathe_2
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.5"
    networks:
      - cnc_network
    restart: unless-stopped

  lathe_3:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_lathe
    container_name: lathe_3_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ../bearing_data:/app/bearing_data:ro
      - ./data:/app/data
    environment:
      LATHE_NAME: lathe_3
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.5"
    networks:
      - cnc_network
    restart: unless-stopped

  # ── Hydraulic unit containers ─────────────────────────────────────────────

  hydraulic_1:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_hydraulic
    container_name: hydraulic_1_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models/hydraulic:/app/models/hydraulic:ro
      - ../../hydraulic_data:/app/hydraulic_data:ro
    environment:
      UNIT_NAME: hydraulic_1
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.5"
    networks:
      - cnc_network
    restart: unless-stopped

  hydraulic_2:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_hydraulic
    container_name: hydraulic_2_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models/hydraulic:/app/models/hydraulic:ro
      - ../../hydraulic_data:/app/hydraulic_data:ro
    environment:
      UNIT_NAME: hydraulic_2
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.5"
    networks:
      - cnc_network
    restart: unless-stopped

  hydraulic_3:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_hydraulic
    container_name: hydraulic_3_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models/hydraulic:/app/models/hydraulic:ro
      - ../../hydraulic_data:/app/hydraulic_data:ro
    environment:
      UNIT_NAME: hydraulic_3
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.5"
    networks:
      - cnc_network
    restart: unless-stopped

networks:
  cnc_network:
    driver: bridge
