# CNC Predictive Maintenance System
# Digital Systems Project - Charles Rodway

#   docker-compose up --build
#   Open http://localhost:3000 in Chrome
#   Login: supervisor / admin123  OR  maintenance / maint123

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnc_network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./models:/app/models
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
    networks:
      - cnc_network
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: dashboard
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cnc_network
    restart: unless-stopped

  # lathe containers

  lathe_1:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_lathe
    container_name: lathe_1_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ../bearing_data:/app/bearing_data:ro
      - ./data:/app/data
    environment:
      LATHE_NAME: lathe_1
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.1"
      STREAM_START_PERCENT: "20"
    networks:
      - cnc_network
    restart: unless-stopped

  lathe_2:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_lathe
    container_name: lathe_2_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ../bearing_data:/app/bearing_data:ro
      - ./data:/app/data
    environment:
      LATHE_NAME: lathe_2
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.5"
    networks:
      - cnc_network
    restart: unless-stopped

  lathe_3:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_lathe
    container_name: lathe_3_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ../bearing_data:/app/bearing_data:ro
      - ./data:/app/data
    environment:
      LATHE_NAME: lathe_3
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "0.5"
    networks:
      - cnc_network
    restart: unless-stopped

  # hydraulic containers

  hydraulic_1:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_hydraulic
    container_name: hydraulic_1_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models/hydraulic:/app/models/hydraulic:ro
      - ../hydraulic_data:/app/hydraulic_data:ro
    environment:
      UNIT_NAME: hydraulic_1
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "1.5"
      UNIT_STORY: "Valve degrades: optimal -> small lag -> severe lag -> near failure"
      UNIT_SEQUENCE: "1787,1788,1789,1790,1791,1792,1793,1794,1795,1796,1777,1778,1779,1780,1781,1782,1783,1784,1785,1786,1767,1768,1769,1770,1771,1772,1773,1774,1775,1776,1757,1758,1759,1760,1761,1762,1763,1764,1765,1766"
    networks:
      - cnc_network
    restart: unless-stopped

  hydraulic_2:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_hydraulic
    container_name: hydraulic_2_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models/hydraulic:/app/models/hydraulic:ro
      - ../hydraulic_data:/app/hydraulic_data:ro
    environment:
      UNIT_NAME: hydraulic_2
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "1.5"
      UNIT_STORY: "Pump leakage: none -> weak leakage -> severe leakage"
      UNIT_SEQUENCE: "1787,1788,1789,1790,1791,1792,1793,1794,1795,1796,1746,1747,1748,1749,1750,1751,1752,1753,1754,1755,1705,1706,1707,1708,1709,1710,1711,1712,1713,1714"
    networks:
      - cnc_network
    restart: unless-stopped

  hydraulic_3:
    build:
      context: ./src/raspi
      dockerfile: Dockerfile_hydraulic
    container_name: hydraulic_3_raspi
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./models/hydraulic:/app/models/hydraulic:ro
      - ../hydraulic_data:/app/hydraulic_data:ro
    environment:
      UNIT_NAME: hydraulic_3
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: password
      STREAM_DELAY: "1.5"
      UNIT_STORY: "Multi-component: cooler and accumulator degrade together"
      UNIT_SEQUENCE: "1787,1788,1789,1790,1791,1792,1793,1794,1795,1796,1055,1056,1057,1058,1059,1060,1061,1062,1063,1064,1188,1189,1190,1191,1192,1193,1194,1195,1196,1197,589,590,591,592,593,594,595,596,597,598"
    networks:
      - cnc_network
    restart: unless-stopped

networks:
  cnc_network:
    driver: bridge
