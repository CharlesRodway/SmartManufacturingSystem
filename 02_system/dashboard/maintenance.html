<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC Maintenance Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #f2f2ee;
  --surface:     #ffffff;
  --surface2:    #f8f8f5;
  --border:      #ddddd8;
  --text:        #111111;
  --muted:       #777770;
  --healthy:     #1a7a3c;
  --healthy-bg:  #e6f4ec;
  --warning:     #9a5a00;
  --warning-bg:  #fff3d6;
  --critical:    #ba1b1b;
  --critical-bg: #fce8e8;
  --mono:        'IBM Plex Mono', monospace;
  --sans:        'IBM Plex Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: grid;
  grid-template-rows: 48px 1fr;
  overflow: hidden;
}

#topbar {
  background: #111;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}
#topbar .brand { font-family: var(--mono); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
#topbar .brand span { color: #666; font-weight: 400; margin-left: 12px; font-size: 0.7rem; }
#topbar .top-right { display: flex; gap: 12px; align-items: center; }
.pill { font-family: var(--mono); font-size: 0.65rem; padding: 3px 8px; border-radius: 2px; border: 1px solid #333; color: #666; letter-spacing: 0.05em; }
.pill.ok  { border-color: #1a7a3c; color: #4caf7d; }
.pill.err { border-color: #ba1b1b; color: #ef5350; }
.logout-btn { font-family: var(--mono); font-size: 0.62rem; padding: 3px 8px; border-radius: 2px; border: 1px solid #444; color: #888; background: none; cursor: pointer; letter-spacing: 0.05em; }
.logout-btn:hover { color: #fff; border-color: #666; }
#clock { font-family: var(--mono); font-size: 0.72rem; color: #555; }

#main {
  display: grid;
  grid-template-columns: 280px 1fr 280px;
  overflow: hidden;
}

.panel { background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
#left-panel  { border-right: 1px solid var(--border); }
#right-panel { border-left: 1px solid var(--border); }
#centre-panel { background: var(--bg); overflow-y: auto; padding: 16px; }

.panel-hdr {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.panel-hdr strong { color: var(--text); }

.scroll { flex: 1; overflow-y: auto; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* machine status cards in centre */
.maint-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 3px;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.maint-card.healthy  { border-left-color: var(--healthy); }
.maint-card.warning  { border-left-color: #e08000; }
.maint-card.critical { border-left-color: var(--critical); }
.maint-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.maint-card-name { font-weight: 600; font-size: 0.9rem; }
.maint-card-type { font-family: var(--mono); font-size: 0.6rem; color: var(--muted); margin-top: 2px; }
.maint-status { font-family: var(--mono); font-size: 0.7rem; font-weight: 600; padding: 3px 10px; border-radius: 2px; }
.maint-status.healthy  { background: var(--healthy-bg); color: var(--healthy); }
.maint-status.warning  { background: var(--warning-bg); color: var(--warning); }
.maint-status.critical { background: var(--critical-bg); color: var(--critical); }
.maint-status.no-data  { background: #f0f0ec; color: var(--muted); }
.maint-issues { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); line-height: 1.8; }
.maint-issue  { color: var(--critical); }
.maint-reading { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); margin-top: 6px; }

/* alerts */
.alert-item { border: 1px solid #f0b0b0; border-left: 3px solid var(--critical); border-radius: 2px; padding: 10px 12px; margin: 8px; }
.alert-item .ai-title { font-weight: 600; color: var(--critical); font-size: 0.8rem; margin-bottom: 4px; }
.alert-item .ai-meta  { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); line-height: 1.7; }

/* event log */
#event-log { flex: 1; overflow-y: auto; padding: 8px; font-family: var(--mono); font-size: 0.7rem; line-height: 1.7; }
.log-entry { padding: 4px 8px; border-radius: 2px; margin-bottom: 3px; display: flex; gap: 8px; animation: fadein 0.3s ease; }
@keyframes fadein { from{opacity:0;transform:translateY(-3px)} to{opacity:1} }
.log-time { color: var(--muted); flex-shrink: 0; font-size: 0.64rem; }
.log-entry.critical { background: var(--critical-bg); color: var(--critical); }
.log-entry.warning  { background: var(--warning-bg);  color: var(--warning); }
.log-entry.healthy  { background: var(--healthy-bg);  color: var(--healthy); }
.log-entry.info     { color: var(--muted); }

.no-data-msg { color: var(--muted); font-family: var(--mono); font-size: 0.75rem; padding: 20px; text-align: center; }

.section-hdr {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">CNC Maintenance Panel <span>Digital Systems Project — Charles Rodway</span></div>
  <div class="top-right">
    <div class="pill" id="backend-pill">CONNECTING</div>
    <div id="clock">--:--:--</div>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </div>
</div>

<div id="main">

  <!-- LEFT — critical alerts -->
  <div class="panel" id="left-panel">
    <div class="panel-hdr">
      <span>Critical Alerts</span>
      <strong id="alert-count" style="color:var(--critical)">0</strong>
    </div>
    <div class="scroll">
      <div id="alert-list"></div>
    </div>
  </div>

  <!-- CENTRE — machine status overview -->
  <div id="centre-panel">
    <div class="section-hdr">Machine Status Overview</div>
    <div id="machine-status-list">
      <div class="no-data-msg">Connecting to backend...</div>
    </div>
  </div>

  <!-- RIGHT — event log -->
  <div class="panel" id="right-panel">
    <div class="panel-hdr">
      <span>System Events</span>
      <strong id="event-count">0</strong>
    </div>
    <div id="event-log"></div>
  </div>

</div>

<script src="/dashboard.js"></script>
<script src="/machines/lathe.js"></script>
<script src="/machines/hydraulic.js"></script>
<script>
// maintenance view — only shows status summary, alerts, and event log
// no history charts, no machine registration, no detailed bearing view

window.addEventListener('load', () => {
    if (!checkAuth('maintenance')) return;
    startClock();
    addLog('info', `Signed in as ${sessionStorage.getItem('cnc_user')} (maintenance)`);
    poll();
});

function renderMachineStatusList(bearingState, hydState) {
    const el = document.getElementById('machine-status-list');
    let html = '';

    // get status summary from each machine type module
    const latheMod = MachineRegistry.get('lathe');
    const hydMod   = MachineRegistry.get('hydraulic');

    Object.entries(bearingState).forEach(([name, state]) => {
        if (!latheMod) return;
        const s = latheMod.getStatusSummary(name, state);
        if (!s) return;
        const statusClass = s.status.toLowerCase().replace(' ', '');
        html += `<div class="maint-card ${statusClass}">
            <div class="maint-card-top">
                <div>
                    <div class="maint-card-name">${s.name}</div>
                    <div class="maint-card-type">${s.type}</div>
                </div>
                <div class="maint-status ${statusClass}">${s.status}</div>
            </div>
            <div class="maint-issues">
                ${s.issues.length === 0
                    ? '<span>All bearings healthy</span>'
                    : s.issues.map(i => `<div class="maint-issue">⚠ ${i}</div>`).join('')}
            </div>
            <div class="maint-reading">${s.reading}</div>
        </div>`;
    });

    Object.entries(hydState).forEach(([name, state]) => {
        if (!hydMod) return;
        const s = hydMod.getStatusSummary(name, state);
        if (!s) return;
        const statusClass = s.status.toLowerCase().replace(' ', '');
        html += `<div class="maint-card ${statusClass}">
            <div class="maint-card-top">
                <div>
                    <div class="maint-card-name">${s.name}</div>
                    <div class="maint-card-type">${s.type}</div>
                </div>
                <div class="maint-status ${statusClass}">${s.status}</div>
            </div>
            <div class="maint-issues">
                ${s.issues.length === 0
                    ? '<span>All components healthy</span>'
                    : s.issues.map(i => `<div class="maint-issue">⚠ ${i}</div>`).join('')}
            </div>
            <div class="maint-reading">${s.reading}</div>
        </div>`;
    });

    el.innerHTML = html || '<div class="no-data-msg">No machines connected.</div>';
}

async function poll() {
    const [state, hydState, alerts] = await Promise.all([
        fetchState(),
        fetchHydraulicState(),
        fetchAlerts()
    ]);

    if (state) {
        detectChanges(state);
        systemState = state;
    }
    if (hydState) hydraulicState = hydState;

    renderMachineStatusList(systemState, hydraulicState);
    renderAlerts(alerts);
    renderLog();

    setTimeout(poll, POLL_MS);
}
</script>
</body>
</html>
