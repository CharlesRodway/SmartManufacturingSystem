<!DOCTYPE html>
<!--
  CNC Predictive Maintenance Dashboard
  Digital Systems Project - Charles Rodway

  Standalone HTML dashboard. Open in Chrome while docker-compose is running.
  Connects to backend API at http://localhost:8000

  Visualisations:
    - Fleet heatmap: all machines x all bearings at a glance
    - SVG health gauges per bearing (streak + anomaly rate weighted)
    - Estimated readings to failure based on degradation rate
    - Anomaly rate spark bars from rolling history
    - Live event log terminal
    - History charts (score, kurtosis, RMS)
    - Maintenance alert log
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC Predictive Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  --bg:          #f2f2ee;
  --surface:     #ffffff;
  --surface2:    #f8f8f5;
  --border:      #ddddd8;
  --text:        #111111;
  --muted:       #777770;
  --healthy:     #1a7a3c;
  --healthy-bg:  #e6f4ec;
  --warning:     #9a5a00;
  --warning-bg:  #fff3d6;
  --critical:    #ba1b1b;
  --critical-bg: #fce8e8;
  --mono:        'IBM Plex Mono', monospace;
  --sans:        'IBM Plex Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: grid;
  grid-template-rows: 48px 1fr;
  overflow: hidden;
}

/* topbar */
#topbar {
  background: #111;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
}
#topbar .brand {
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
#topbar .brand span { color: #666; font-weight: 400; margin-left: 12px; font-size: 0.7rem; }
#topbar .top-right { display: flex; gap: 12px; align-items: center; }
.pill {
  font-family: var(--mono);
  font-size: 0.65rem;
  padding: 3px 8px;
  border-radius: 2px;
  border: 1px solid #333;
  color: #666;
  letter-spacing: 0.05em;
}
.pill.ok  { border-color: #1a7a3c; color: #4caf7d; }
.pill.err { border-color: #ba1b1b; color: #ef5350; }
#clock { font-family: var(--mono); font-size: 0.72rem; color: #555; }

/* main grid */
#main {
  display: grid;
  grid-template-columns: 240px 1fr 300px;
  overflow: hidden;
}

/* panels */
.panel { background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
#left-panel   { border-right: 1px solid var(--border); }
#right-panel  { border-left: 1px solid var(--border); }
#centre-panel { background: var(--bg); overflow-y: auto; }

.panel-hdr {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.panel-hdr strong { color: var(--text); }

.scroll { flex: 1; overflow-y: auto; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* fleet heatmap */
#heatmap-section {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#heatmap-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}
.hm-row { display: flex; gap: 3px; align-items: center; margin-bottom: 3px; }
.hm-lathe-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--muted);
  width: 48px;
  flex-shrink: 0;
  text-align: right;
  padding-right: 5px;
}
.hm-cell {
  flex: 1;
  height: 20px;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 0.55rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: background 0.4s;
}
.hm-cell.healthy  { background: var(--healthy-bg); color: var(--healthy); border: 1px solid #b8dfc5; }
.hm-cell.warning  { background: var(--warning-bg); color: var(--warning); border: 1px solid #f0d090; }
.hm-cell.critical { background: var(--critical-bg); color: var(--critical); border: 1px solid #f0b0b0; animation: blink 1.4s infinite; }
.hm-cell.no-data  { background: #f0f0ec; color: var(--muted); border: 1px solid var(--border); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.55} }

/* machine list */
#machine-list { padding: 8px; }
.mc {
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 3px;
  padding: 10px 12px;
  margin-bottom: 5px;
  cursor: pointer;
  background: var(--surface);
  transition: border-color 0.1s, background 0.1s;
}
.mc:hover { border-color: #aaa; border-left-color: inherit; }
.mc.selected { background: var(--surface2); border-color: #999; }
.mc.healthy  { border-left-color: var(--healthy); }
.mc.warning  { border-left-color: #e08000; }
.mc.critical { border-left-color: var(--critical); }
.mc-name { font-weight: 600; font-size: 0.84rem; margin-bottom: 3px; }
.mc-status { font-family: var(--mono); font-size: 0.67rem; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 5px; }
.mc-status.healthy  { color: var(--healthy); }
.mc-status.warning  { color: #e08000; }
.mc-status.critical { color: var(--critical); }
.mc-status.no-data  { color: var(--muted); }
.mc-bar-bg { background: var(--border); height: 2px; border-radius: 1px; }
.mc-bar { height: 2px; border-radius: 1px; transition: width 0.4s; }
.mc-meta { font-family: var(--mono); font-size: 0.63rem; color: var(--muted); margin-top: 4px; }

/* centre detail */
#detail-hdr {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 13px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
}
.dh-name { font-size: 1rem; font-weight: 700; }
.dh-sub  { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

.status-badge {
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 5px 14px;
  border-radius: 2px;
}
.status-badge.healthy  { background: var(--healthy-bg); color: var(--healthy); border: 1px solid #b8dfc5; }
.status-badge.warning  { background: var(--warning-bg); color: var(--warning); border: 1px solid #f0d090; }
.status-badge.critical { background: var(--critical-bg); color: var(--critical); border: 1px solid #f0b0b0; animation: pulse 1.2s infinite; }
.status-badge.no-data  { background: #f0f0ec; color: var(--muted); border: 1px solid var(--border); }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(186,27,27,0.2)} 50%{box-shadow:0 0 0 5px rgba(186,27,27,0)} }

#detail-progress-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 6px 18px 10px;
  display: flex;
  gap: 14px;
  align-items: center;
  font-family: var(--mono);
  font-size: 0.67rem;
  color: var(--muted);
}
#detail-progress-bar-bg { flex: 1; background: var(--border); height: 3px; border-radius: 2px; }
#detail-progress-bar { height: 3px; border-radius: 2px; transition: width 0.4s; }

/* bearing cards 2x2 */
#bearing-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 14px;
}

.bc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 14px;
  position: relative;
}
.bc::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  border-radius: 3px 3px 0 0;
}
.bc.healthy::before  { background: var(--healthy); }
.bc.warning::before  { background: #e08000; }
.bc.critical::before { background: var(--critical); }

.bc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.bc-name { font-size: 0.73rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.bc-tags { display: flex; gap: 4px; }
.tag { font-family: var(--mono); font-size: 0.57rem; padding: 1px 5px; border-radius: 2px; letter-spacing: 0.03em; }
.tag.known   { background: #f0f0ec; color: var(--muted); border: 1px solid var(--border); }
.tag.latched { background: var(--critical-bg); color: var(--critical); border: 1px solid #f0b0b0; }

/* metrics grid */
.bc-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.bc-metric label {
  display: block;
  font-size: 0.59rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  margin-bottom: 1px;
}
.bc-metric .val { font-family: var(--mono); font-size: 0.79rem; font-weight: 600; }
.val.neg  { color: var(--critical); }
.val.pos  { color: var(--healthy); }
.val.warn { color: #e08000; }

/* spark bars */
.spark-bar-wrap { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.spark-label {
  font-family: var(--mono);
  font-size: 0.59rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}
.spark-bars { display: flex; gap: 2px; height: 20px; align-items: flex-end; }
.spark-bar { flex: 1; border-radius: 1px 1px 0 0; min-height: 2px; }

/* hydraulic component grid */
#hydraulic-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 14px;
}
.hc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 14px;
  position: relative;
}
.hc::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  border-radius: 3px 3px 0 0;
}
.hc.healthy::before  { background: var(--healthy); }
.hc.warning::before  { background: #e08000; }
.hc.critical::before { background: var(--critical); }
.hc-name { font-size: 0.73rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; }
.hc-condition {
  font-family: var(--mono);
  font-size: 0.82rem;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 2px;
  text-align: center;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
}
.hc-condition.healthy  { background: var(--healthy-bg); color: var(--healthy); border-color: #b8dfc5; }
.hc-condition.warning  { background: var(--warning-bg); color: var(--warning); border-color: #f0d090; }
.hc-condition.critical { background: var(--critical-bg); color: var(--critical); border-color: #f0b0b0; animation: blink 1.4s infinite; }
.mc-type {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 1px 5px;
  border: 1px solid var(--border);
  border-radius: 2px;
  display: inline-block;
  margin-bottom: 3px;
}

/* right panel tabs */
#right-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.rtab {
  flex: 1;
  padding: 10px 4px;
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  text-align: center;
  cursor: pointer;
  color: var(--muted);
  border: none;
  border-bottom: 2px solid transparent;
  background: none;
  transition: all 0.1s;
}
.rtab.active { color: var(--text); border-bottom-color: var(--text); }
.rtab:hover  { color: var(--text); }

.rtab-content { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.rtab-content.active { display: flex; }

/* event log */
#event-log { flex: 1; overflow-y: auto; padding: 8px; font-family: var(--mono); font-size: 0.7rem; line-height: 1.7; }
.log-entry {
  padding: 4px 8px;
  border-radius: 2px;
  margin-bottom: 3px;
  display: flex;
  gap: 8px;
  animation: fadein 0.3s ease;
}
@keyframes fadein { from{opacity:0;transform:translateY(-3px)} to{opacity:1} }
.log-time { color: var(--muted); flex-shrink: 0; font-size: 0.64rem; }
.log-entry.critical { background: var(--critical-bg); color: var(--critical); }
.log-entry.warning  { background: var(--warning-bg);  color: var(--warning); }
.log-entry.healthy  { background: var(--healthy-bg);  color: var(--healthy); }
.log-entry.info     { color: var(--muted); }

/* history charts */
#history-wrap { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.hist-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 10px; }
.hist-box label { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }

/* alert log */
#alert-list { flex: 1; overflow-y: auto; padding: 8px; }
.alert-item { border: 1px solid #f0b0b0; border-left: 3px solid var(--critical); border-radius: 2px; padding: 10px 12px; margin-bottom: 6px; }
.alert-item .ai-title { font-weight: 600; color: var(--critical); font-size: 0.8rem; margin-bottom: 4px; }
.alert-item .ai-meta  { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); line-height: 1.7; }

/* register form */
#register-wrap { flex: 1; overflow-y: auto; padding: 12px; }
#register-wrap label { display: block; font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; margin-top: 8px; }
#register-wrap input, #register-wrap select { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 3px; font-family: var(--sans); font-size: 0.82rem; background: var(--bg); color: var(--text); }
#register-wrap button { width: 100%; margin-top: 12px; padding: 9px; background: var(--text); color: white; border: none; border-radius: 3px; font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.06em; cursor: pointer; }
#register-wrap button:hover { background: #333; }
.form-msg { font-family: var(--mono); font-size: 0.72rem; padding: 7px 10px; border-radius: 3px; margin-top: 8px; }
.form-msg.ok  { background: var(--healthy-bg); color: var(--healthy); }
.form-msg.err { background: var(--critical-bg); color: var(--critical); }

.no-data-msg { color: var(--muted); font-family: var(--mono); font-size: 0.75rem; padding: 20px; text-align: center; }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">CNC Predictive Maintenance <span>Digital Systems Project — Charles Rodway</span></div>
  <div class="top-right">
    <div class="pill" id="backend-pill">CONNECTING</div>
    <div id="clock">--:--:--</div>
  </div>
</div>

<div id="main">

  <!-- LEFT -->
  <div class="panel" id="left-panel">
    <div class="panel-hdr"><span>Fleet Overview</span><strong id="machine-count">0</strong></div>
    <div id="heatmap-section">
      <div id="heatmap-label">Fleet Overview</div>
      <div id="heatmap-grid"></div>
    </div>
    <div class="scroll"><div id="machine-list"></div></div>
  </div>

  <!-- CENTRE -->
  <div id="centre-panel">
    <div id="detail-hdr">
      <div>
        <div class="dh-name" id="dh-name">Select a machine</div>
        <div class="dh-sub"  id="dh-sub">—</div>
      </div>
      <div class="status-badge no-data" id="dh-badge">NO DATA</div>
    </div>
    <div id="detail-progress-wrap">
      <span id="detail-progress-txt">—</span>
      <div id="detail-progress-bar-bg"><div id="detail-progress-bar" style="width:0%"></div></div>
    </div>
    <div id="bearing-grid"></div>
    <div id="hydraulic-grid" style="display:none"></div>
  </div>

  <!-- RIGHT -->
  <div class="panel" id="right-panel">
    <div id="right-tabs">
      <button class="rtab active" onclick="switchTab('log')">Log</button>
      <button class="rtab" onclick="switchTab('history')">History</button>
      <button class="rtab" onclick="switchTab('alerts')">Alerts</button>
      <button class="rtab" onclick="switchTab('register')">+ New</button>
    </div>

    <div class="rtab-content active" id="tab-log">
      <div class="panel-hdr"><span>System Events</span><strong id="event-count">0</strong></div>
      <div id="event-log"></div>
    </div>

    <div class="rtab-content" id="tab-history">
      <div class="panel-hdr"><span>Degradation History</span></div>
      <div id="history-wrap">
        <div class="hist-box"><label>Anomaly Score</label><canvas id="hist-score" height="90"></canvas></div>
        <div class="hist-box"><label>Kurtosis</label><canvas id="hist-kurtosis" height="90"></canvas></div>
        <div class="hist-box"><label>RMS Energy</label><canvas id="hist-rms" height="90"></canvas></div>
      </div>
    </div>

    <div class="rtab-content" id="tab-alerts">
      <div class="panel-hdr"><span>Critical Alerts</span><strong id="alert-count" style="color:var(--critical)">0</strong></div>
      <div id="alert-list"></div>
    </div>

    <div class="rtab-content" id="tab-register">
      <div class="panel-hdr"><span>Register New Lathe</span></div>
      <div id="register-wrap">
        <label>Lathe ID</label><input type="text" id="reg-id" placeholder="lathe_4">
        <label>Display Name</label><input type="text" id="reg-name" placeholder="Lathe 4 - Workshop B">
        <label>Bearings</label>
        <select id="reg-bearings"><option>4</option><option>2</option><option>3</option><option>5</option><option>6</option></select>
        <label>Sensors per Bearing</label>
        <select id="reg-sensors"><option value="1">1 sensor</option><option value="2">2 sensors</option></select>
        <label>Collection Period (hours)</label>
        <input type="number" id="reg-hours" value="336" min="24" max="720">
        <button onclick="registerLathe()">Register Machine</button>
        <div id="reg-msg"></div>
      </div>
    </div>
  </div>
</div>

<script>
const BACKEND    = 'http://localhost:8000';
const POLL_MS    = 2000;
const STREAK_MAX = 50;
const HISTORY_N  = 200;
const SPARK_N    = 30;
const LOG_MAX    = 80;
const B_COLOURS  = ['#1a7a3c','#1f6feb','#e08000','#7c3aed'];

let selectedMachine  = null;
let selectedType     = 'bearing';  // 'bearing' or 'hydraulic'
let systemState      = {};
let hydraulicState   = {};
let prevStatuses     = {};
let eventLog         = [];
let liveHistory      = {};
let histScoreChart, histKurtChart, histRmsChart;

// clock
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toTimeString().slice(0,8);
}, 1000);

function switchTab(name) {
  const names = ['log','history','alerts','register'];
  document.querySelectorAll('.rtab').forEach((t,i) => t.classList.toggle('active', names[i] === name));
  document.querySelectorAll('.rtab-content').forEach(c => c.classList.toggle('active', c.id === `tab-${name}`));
  if (name === 'history' && selectedMachine && selectedType === 'bearing' && liveHistory[selectedMachine]) {
    updateHistCharts(liveHistory[selectedMachine]);
  }
}

// spark bars - last SPARK_N anomaly scores as tiny bar chart
// red = anomalous (negative score), green = healthy (positive)
function makeSparkBars(scores) {
  if (!scores || scores.length === 0) return '';
  const maxAbs = Math.max(...scores.map(v => Math.abs(v)), 0.001);
  return scores.map(v => {
    const h  = Math.max(2, Math.round((Math.abs(v) / maxAbs) * 18));
    const bg = v < 0 ? '#ba1b1b' : '#1a7a3c';
    return `<div class="spark-bar" style="height:${h}px;background:${bg};opacity:0.65"></div>`;
  }).join('');
}

async function fetchState() {
  try {
    const r    = await fetch(`${BACKEND}/state`);
    if (!r.ok) throw new Error();
    const pill = document.getElementById('backend-pill');
    pill.className   = 'pill ok';
    pill.textContent = 'BACKEND OK';
    return await r.json();
  } catch {
    const pill = document.getElementById('backend-pill');
    pill.className   = 'pill err';
    pill.textContent = 'OFFLINE';
    return null;
  }
}

async function fetchHydraulicState() {
  try {
    const r = await fetch(`${BACKEND}/hydraulic/state`);
    if (!r.ok) return {};
    return await r.json();
  } catch { return {}; }
}

async function fetchHistory(lathe) {
  try {
    const r = await fetch(`${BACKEND}/history/${lathe}?n=${HISTORY_N}`);
    if (!r.ok) return [];
    return await r.json();
  } catch { return []; }
}

async function fetchHydraulicHistory(unit) {
  try {
    const r = await fetch(`${BACKEND}/hydraulic/history/${unit}?n=100`);
    if (!r.ok) return [];
    return await r.json();
  } catch { return []; }
}

async function fetchAlerts() {
  try {
    const r = await fetch(`${BACKEND}/alerts`);
    if (!r.ok) return [];
    return await r.json();
  } catch { return []; }
}

// heatmap
function renderHeatmap(bearingState, hydState) {
  const grid   = document.getElementById('heatmap-grid');
  const lathes = Object.keys(bearingState);
  const units  = Object.keys(hydState);
  if (lathes.length === 0 && units.length === 0) { grid.innerHTML = ''; return; }

  let html = '';

  // bearing lathes
  if (lathes.length > 0) {
    const bearings = Object.keys(bearingState[lathes[0]]?.bearings || {});
    html += `<div class="hm-row">
      <div class="hm-lathe-label"></div>
      ${bearings.map(b => `<div class="hm-cell" style="background:none;border:none;font-size:0.55rem;color:var(--muted);height:12px;">${b.replace('bearing','B')}</div>`).join('')}
    </div>`;
    lathes.forEach(lathe => {
      const s = bearingState[lathe];
      html += `<div class="hm-row"><div class="hm-lathe-label">${lathe.replace('lathe_','L')}</div>`;
      bearings.forEach(b => {
        const status = s?.bearings?.[b]?.status?.toLowerCase() || 'no-data';
        const short  = status === 'no-data' ? '—' : status.slice(0,3).toUpperCase();
        html += `<div class="hm-cell ${status}" title="${lathe} ${b}: ${status}">${short}</div>`;
      });
      html += '</div>';
    });
  }

  // hydraulic units — one cell per unit showing overall status
  if (units.length > 0) {
    if (lathes.length > 0) html += `<div style="height:6px"></div>`;
    html += `<div class="hm-row">
      <div class="hm-lathe-label"></div>
      <div class="hm-cell" style="background:none;border:none;font-size:0.55rem;color:var(--muted);height:12px;flex:4">HYD UNITS</div>
    </div>`;
    units.forEach(unit => {
      const status = (hydState[unit]?.unit_status || 'no-data').toLowerCase();
      const short  = status === 'no-data' ? '—' : status.slice(0,3).toUpperCase();
      html += `<div class="hm-row">
        <div class="hm-lathe-label">${unit.replace('hydraulic_','H')}</div>
        <div class="hm-cell ${status}" style="flex:4" title="${unit}: ${status}">${short}</div>
      </div>`;
    });
  }

  grid.innerHTML = html;
}

// machine list
function renderMachineList(bearingState, hydState) {
  const lathes = Object.keys(bearingState);
  const units  = Object.keys(hydState);
  const total  = lathes.length + units.length;
  document.getElementById('machine-count').textContent = total;

  if (!selectedMachine && lathes.length > 0) { selectedMachine = lathes[0]; selectedType = 'bearing'; }
  else if (!selectedMachine && units.length > 0) { selectedMachine = units[0]; selectedType = 'hydraulic'; }

  let html = '';

  lathes.forEach(name => {
    const s      = bearingState[name];
    const status = (s?.machine_status || 'NO DATA').toLowerCase().replace(' ','');
    const reading = s?.reading || 0;
    const total   = s?.total   || 0;
    const pct     = total > 0 ? (reading / total * 100) : 0;
    const barCol  = status === 'critical' ? 'var(--critical)' : status === 'warning' ? '#e08000' : 'var(--healthy)';
    const sel     = name === selectedMachine && selectedType === 'bearing' ? 'selected' : '';
    const display = name.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    html += `<div class="mc ${status} ${sel}" onclick="selectMachine('${name}','bearing')">
      <div class="mc-type">CNC Lathe</div>
      <div class="mc-name">${display}</div>
      <div class="mc-status ${status}">${s?.machine_status || 'NO DATA'}</div>
      <div class="mc-meta">${reading} / ${total} readings</div>
      <div class="mc-bar-bg"><div class="mc-bar" style="width:${pct.toFixed(1)}%;background:${barCol}"></div></div>
    </div>`;
  });

  units.forEach(name => {
    const s      = hydState[name];
    const status = (s?.unit_status || 'NO DATA').toLowerCase().replace(' ','');
    const cycle   = s?.cycle  || 0;
    const total   = s?.total  || 0;
    const pct     = total > 0 ? (cycle / total * 100) : 0;
    const barCol  = status === 'critical' ? 'var(--critical)' : status === 'warning' ? '#e08000' : 'var(--healthy)';
    const sel     = name === selectedMachine && selectedType === 'hydraulic' ? 'selected' : '';
    const display = name.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    html += `<div class="mc ${status} ${sel}" onclick="selectMachine('${name}','hydraulic')">
      <div class="mc-type">Hydraulic Unit</div>
      <div class="mc-name">${display}</div>
      <div class="mc-status ${status}">${s?.unit_status || 'NO DATA'}</div>
      <div class="mc-meta">${cycle} / ${total} cycles</div>
      <div class="mc-bar-bg"><div class="mc-bar" style="width:${pct.toFixed(1)}%;background:${barCol}"></div></div>
    </div>`;
  });

  document.getElementById('machine-list').innerHTML = html;
}

function selectMachine(name, type) {
  selectedMachine = name;
  selectedType    = type;
  renderMachineList(systemState, hydraulicState);
  if (type === 'bearing') {
    renderBearingDetail(systemState, liveHistory[name] || []);
    fetchHistory(name).then(h => {
      liveHistory[name] = h;
      renderBearingDetail(systemState, h);
      if (document.getElementById('tab-history').classList.contains('active')) updateHistCharts(h);
    });
  } else {
    renderHydraulicDetail(hydraulicState);
  }
}

// bearing detail panel
function renderBearingDetail(state, history) {
  if (!selectedMachine || !state[selectedMachine]) {
    document.getElementById('bearing-grid').innerHTML = '';
    return;
  }
  document.getElementById('bearing-grid').style.display = 'grid';
  document.getElementById('hydraulic-grid').style.display = 'none';

  const s       = state[selectedMachine];
  const status  = s.machine_status || 'NO DATA';
  const reading = s.reading || 0;
  const total   = s.total   || 0;
  const pct     = total > 0 ? (reading / total * 100) : 0;
  const barCol  = status === 'CRITICAL' ? 'var(--critical)' : status === 'WARNING' ? '#e08000' : 'var(--healthy)';
  const display = selectedMachine.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());

  document.getElementById('dh-name').textContent             = display;
  document.getElementById('dh-sub').textContent              = s.filename || '—';
  document.getElementById('detail-progress-txt').textContent = `Reading ${reading} / ${total} (${pct.toFixed(1)}%)`;
  document.getElementById('detail-progress-bar').style.cssText = `width:${pct.toFixed(1)}%;background:${barCol}`;

  const badge       = document.getElementById('dh-badge');
  badge.className   = `status-badge ${status.toLowerCase()}`;
  badge.textContent = status;

  const bearings = s.bearings || {};
  document.getElementById('bearing-grid').innerHTML = Object.entries(bearings).map(([name, b]) => {
    const bStatus     = (b.status || 'HEALTHY').toLowerCase();
    const sparkScores = history.slice(-SPARK_N).map(h => h.bearings?.[name]?.score).filter(v => v !== undefined);
    const anomalyRate = sparkScores.length > 0
      ? Math.round((sparkScores.filter(v => v < 0).length / sparkScores.length) * 100) : 0;

    const scoreClass  = b.score < 0 ? 'neg' : 'pos';
    const streakClass = b.streak > 30 ? 'neg' : b.streak > 10 ? 'warn' : 'pos';
    const latchedTag  = b.latched ? '<span class="tag latched">LATCHED</span>' : '';

    return `<div class="bc ${bStatus}">
      <div class="bc-top">
        <div class="bc-name">${name.replace('bearing','Bearing ')}</div>
        <div class="bc-tags">${latchedTag}</div>
      </div>
      <div class="bc-metrics">
        <div class="bc-metric">
          <label>Anomaly Score</label>
          <div class="val ${scoreClass}">${b.score >= 0 ? '+' : ''}${b.score?.toFixed(4)}</div>
        </div>
        <div class="bc-metric">
          <label>Streak</label>
          <div class="val ${streakClass}">${b.streak} / ${STREAK_MAX}</div>
        </div>
        <div class="bc-metric">
          <label>Kurtosis</label>
          <div class="val">${b.kurtosis?.toFixed(3)}</div>
        </div>
        <div class="bc-metric">
          <label>RMS Energy</label>
          <div class="val">${b.rms?.toFixed(4)}</div>
        </div>
      </div>
      <div class="spark-bar-wrap">
        <div class="spark-label">
          <span>Anomaly rate (last ${SPARK_N})</span>
          <span>${anomalyRate}%</span>
        </div>
        <div class="spark-bars">${makeSparkBars(sparkScores)}</div>
      </div>
    </div>`;
  }).join('');
}

// hydraulic detail panel
function renderHydraulicDetail(hydState) {
  if (!selectedMachine || !hydState[selectedMachine]) {
    document.getElementById('hydraulic-grid').innerHTML = '';
    return;
  }
  document.getElementById('bearing-grid').style.display = 'none';
  document.getElementById('hydraulic-grid').style.display = 'grid';

  const s       = hydState[selectedMachine];
  const status  = s.unit_status || 'NO DATA';
  const cycle   = s.cycle  || 0;
  const total   = s.total  || 0;
  const pct     = total > 0 ? (cycle / total * 100) : 0;
  const barCol  = status === 'CRITICAL' ? 'var(--critical)' : status === 'WARNING' ? '#e08000' : 'var(--healthy)';
  const display = selectedMachine.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());

  document.getElementById('dh-name').textContent             = display;
  document.getElementById('dh-sub').textContent              = `Cycle ${cycle} of ${total}`;
  document.getElementById('detail-progress-txt').textContent = `Cycle ${cycle} / ${total} (${pct.toFixed(1)}%)`;
  document.getElementById('detail-progress-bar').style.cssText = `width:${pct.toFixed(1)}%;background:${barCol}`;

  const badge       = document.getElementById('dh-badge');
  badge.className   = `status-badge ${status.toLowerCase()}`;
  badge.textContent = status;

  const components = s.components || {};
  document.getElementById('hydraulic-grid').innerHTML = Object.entries(components).map(([name, c]) => {
    const cStatus = (c.status || 'HEALTHY').toLowerCase();
    return `<div class="hc ${cStatus}">
      <div class="hc-name">${name.charAt(0).toUpperCase() + name.slice(1)}</div>
      <div class="hc-condition ${cStatus}">${c.label || 'Unknown'}</div>
    </div>`;
  }).join('');
}

// history charts
function makeHistChart(id) {
  return new Chart(document.getElementById(id).getContext('2d'), {
    type: 'line',
    data: { labels: [], datasets: [] },
    options: {
      responsive: true, maintainAspectRatio: true, animation: false,
      plugins: { legend: { labels: { font: { family: 'IBM Plex Mono', size: 9 }, color: '#777', boxWidth: 8, padding: 8 } } },
      scales: {
        x: { ticks: { font: { family: 'IBM Plex Mono', size: 8 }, color: '#aaa', maxTicksLimit: 5 }, grid: { color: '#eee' } },
        y: { ticks: { font: { family: 'IBM Plex Mono', size: 8 }, color: '#aaa' }, grid: { color: '#eee' } }
      }
    }
  });
}

function updateHistCharts(history) {
  if (!history || history.length === 0) return;
  const bearings = Object.keys(history[0]?.bearings || {});
  const labels   = history.map(h => h.reading);
  [
    { chart: histScoreChart, key: 'score' },
    { chart: histKurtChart,  key: 'kurtosis' },
    { chart: histRmsChart,   key: 'rms' }
  ].forEach(({ chart, key }) => {
    if (!chart) return;
    chart.data.labels   = labels;
    chart.data.datasets = bearings.map((b, i) => ({
      label: b.replace('bearing','B'),
      data:  history.map(h => h.bearings[b]?.[key]),
      borderColor: B_COLOURS[i % B_COLOURS.length],
      backgroundColor: 'transparent',
      borderWidth: 1.5, pointRadius: 0, tension: 0.3
    }));
    chart.update('none');
  });
}

// event log
function addLog(level, text) {
  eventLog.unshift({ time: new Date().toTimeString().slice(0,8), level, text });
  if (eventLog.length > LOG_MAX) eventLog.length = LOG_MAX;
}

function renderLog() {
  const el = document.getElementById('event-log');
  document.getElementById('event-count').textContent = eventLog.length;
  el.innerHTML = eventLog.length === 0
    ? '<div class="no-data-msg">Waiting for events...</div>'
    : eventLog.map(e => `<div class="log-entry ${e.level}"><span class="log-time">${e.time}</span><span>${e.text}</span></div>`).join('');
}

function detectChanges(newState) {
  for (const [lathe, data] of Object.entries(newState)) {
    const display = lathe.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    for (const [bearing, bdata] of Object.entries(data.bearings || {})) {
      const key  = `${lathe}_${bearing}`;
      const prev = prevStatuses[key];
      const curr = bdata.status;
      const bl   = bearing.replace('bearing','B');
      if (prev && prev !== curr) {
        if (curr === 'CRITICAL') addLog('critical', `${display} ${bl} CRITICAL (streak: ${bdata.streak})`);
        else if (curr === 'WARNING') addLog('warning', `${display} ${bl} WARNING (streak: ${bdata.streak})`);
        else if (curr === 'HEALTHY') addLog('healthy', `${display} ${bl} returned HEALTHY`);
      }
      prevStatuses[key] = curr;
    }
  }
}

// alerts
function renderAlerts(alerts) {
  document.getElementById('alert-count').textContent = alerts.length;
  document.getElementById('alert-list').innerHTML = alerts.length === 0
    ? '<div class="no-data-msg">No critical alerts logged.</div>'
    : alerts.map(a => `<div class="alert-item">
        <div class="ai-title">${a.lathe.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())} — ${a.bearing.replace('bearing','Bearing ')}</div>
        <div class="ai-meta">${a.timestamp?.slice(0,19).replace('T',' ') || 'N/A'}<br>Score: ${a.score?.toFixed(4)} · Kurt: ${a.kurtosis?.toFixed(3)}<br>Reading: ${a.reading}</div>
      </div>`).join('');
}

// register
function registerLathe() {
  const id   = document.getElementById('reg-id').value.trim().toLowerCase().replace(/\s+/g,'_');
  const name = document.getElementById('reg-name').value.trim();
  const msg  = document.getElementById('reg-msg');
  if (!id || !name) { msg.className = 'form-msg err'; msg.textContent = 'Fill in all fields.'; return; }
  msg.className   = 'form-msg ok';
  msg.textContent = `Add "${id}" to lathes.json with status: "collecting" to register this machine.`;
}

// poll loop
async function poll() {
  const [state, hydState] = await Promise.all([fetchState(), fetchHydraulicState()]);

  if (state) {
    systemState = state;
    detectChanges(state);
  }
  if (hydState) {
    hydraulicState = hydState;
  }

  renderHeatmap(systemState, hydraulicState);
  renderMachineList(systemState, hydraulicState);

  if (selectedMachine && selectedType === 'bearing' && systemState[selectedMachine]) {
    const history = await fetchHistory(selectedMachine);
    liveHistory[selectedMachine] = history;
    renderBearingDetail(systemState, history);
    if (document.getElementById('tab-history').classList.contains('active')) updateHistCharts(history);
  } else if (selectedMachine && selectedType === 'hydraulic') {
    renderHydraulicDetail(hydraulicState);
  } else {
    renderBearingDetail(systemState, []);
  }

  renderAlerts(await fetchAlerts());
  renderLog();
  setTimeout(poll, POLL_MS);
}

// init
window.addEventListener('load', () => {
  histScoreChart = makeHistChart('hist-score');
  histKurtChart  = makeHistChart('hist-kurtosis');
  histRmsChart   = makeHistChart('hist-rms');
  addLog('info', 'Dashboard initialised. Connecting to backend...');
  poll();
});
</script>
